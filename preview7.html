<style>
  :root {
    --bg:      #04050a;
    --panel:   #0b0e17;
    --line:    #1b2030;
    --line-2:  #2a3147;
    --teal:    #5eead4;
    --indigo:  #818cf8;
    --violet:  #c084fc;
    --pink:    #f0abfc;
    --emerald: #34d399;
    --text:    #f2f4fa;
    --text-2:  #cdd2e0;
    --muted:   #868ea4;
    --muted-2: #525a72;
    --sans:  'Inter', system-ui, sans-serif;
    --serif: 'Instrument Serif', Georgia, serif;
    --mono:  'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(129,140,248,0.35); }
  a { color: inherit; }

  /* deep-space backdrop */
  .space {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 50% at 50% 42%, rgba(129,140,248,0.10), transparent 70%),
      radial-gradient(40% 40% at 18% 80%, rgba(94,234,212,0.07), transparent 70%),
      radial-gradient(45% 45% at 82% 22%, rgba(192,132,252,0.08), transparent 70%),
      var(--bg);
  }
  .vign { position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(4,5,10,0.85) 100%); }

  /* rotating wireframe rings (depth) */
  .rings { position: fixed; inset: 0; z-index: 1; pointer-events: none; display: grid; place-items: center; opacity: 0.4; }
  .ring { position: absolute; border-radius: 50%; border: 1px solid; filter: blur(0.4px); }
  .ring.r1 { width: 92vmin; height: 92vmin; border-color: rgba(94,234,212,0.10); animation: spin 60s linear infinite; }
  .ring.r2 { width: 70vmin; height: 70vmin; border-color: rgba(129,140,248,0.12); border-style: dashed; animation: spin 44s linear infinite reverse; }
  .ring.r3 { width: 50vmin; height: 50vmin; border-color: rgba(192,132,252,0.10); animation: spin 80s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* particle canvas */
  #field { position: fixed; inset: 0; z-index: 3; display: block; }

  /* ── top bar ── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.5rem;
  }
  .brand { display: flex; align-items: center; gap: 0.7rem; font-weight: 600; font-size: 0.92rem; }
  .brand .orb {
    width: 26px; height: 26px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--teal), var(--indigo), var(--violet), var(--pink), var(--teal));
    box-shadow: 0 0 16px rgba(129,140,248,0.5); animation: spin 8s linear infinite;
  }
  .brand small { display: block; font-family: var(--mono); font-size: 0.6rem; color: var(--muted); font-weight: 400; letter-spacing: 0.06em; }
  .topbar-cta {
    padding: 0.5rem 1.1rem; border-radius: 9px; font-size: 0.82rem; font-weight: 500;
    background: rgba(242,244,250,0.95); color: var(--bg); text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .topbar-cta:hover { transform: translateY(-1px); box-shadow: 0 10px 28px -10px rgba(255,255,255,0.4); }

  /* ── floating caption (glass) ── */
  .stage { position: fixed; inset: 0; z-index: 12; pointer-events: none; display: grid; place-items: center; }
  .caption {
    position: absolute; bottom: 16vh; left: 50%; transform: translateX(-50%);
    text-align: center; width: min(640px, 90vw);
    pointer-events: auto;
  }
  .caption-eyebrow {
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.16em;
    color: var(--teal); text-transform: uppercase; margin-bottom: 0.7rem;
    opacity: 0; transform: translateY(8px); transition: opacity 0.5s, transform 0.5s;
  }
  .caption-text {
    font-size: 1.05rem; color: var(--text-2); font-weight: 300; line-height: 1.6;
    opacity: 0; transform: translateY(8px); transition: opacity 0.5s 0.05s, transform 0.5s 0.05s;
  }
  .caption-text b { color: var(--text); font-weight: 500; }
  .caption.show .caption-eyebrow, .caption.show .caption-text { opacity: 1; transform: none; }

  /* progress dots */
  .progress { position: fixed; bottom: 7vh; left: 50%; transform: translateX(-50%); z-index: 14;
    display: flex; gap: 0.55rem; pointer-events: auto; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted-2); cursor: pointer;
    transition: all 0.3s; border: none; padding: 0;
  }
  .dot.on { background: var(--teal); box-shadow: 0 0 10px var(--teal); transform: scale(1.25); }

  /* hint */
  .hint {
    position: fixed; bottom: 7vh; right: 1.6rem; z-index: 14;
    font-family: var(--mono); font-size: 0.68rem; color: var(--muted);
    display: flex; align-items: center; gap: 0.5rem;
    transition: opacity 0.6s; letter-spacing: 0.03em;
  }
  .hint.gone { opacity: 0; }
  .hint .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--indigo);
    box-shadow: 0 0 0 0 rgba(129,140,248,0.6); animation: pp 2s infinite; }
  @keyframes pp { 0%{box-shadow:0 0 0 0 rgba(129,140,248,0.5);} 70%{box-shadow:0 0 0 9px rgba(129,140,248,0);} 100%{box-shadow:0 0 0 0 rgba(129,140,248,0);} }

  /* ── contact dock (appears on final word) ── */
  .dock {
    position: fixed; bottom: 14vh; left: 50%; transform: translateX(-50%) translateY(14px); z-index: 16;
    display: flex; gap: 0.6rem; pointer-events: none; opacity: 0;
    transition: opacity 0.5s, transform 0.5s;
  }
  .dock.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  .dbtn {
    display: inline-flex; align-items: center; gap: 0.45rem;
    padding: 0.7rem 1.25rem; border-radius: 11px; font-size: 0.88rem; font-weight: 500;
    text-decoration: none; backdrop-filter: blur(10px); transition: transform 0.18s, box-shadow 0.18s;
  }
  .dbtn.primary { background: linear-gradient(120deg, var(--teal), var(--indigo)); color: #04050a; }
  .dbtn.primary:hover { transform: translateY(-2px); box-shadow: 0 14px 32px -10px rgba(94,234,212,0.55); }
  .dbtn.ghost { background: rgba(13,17,28,0.6); border: 1px solid var(--line-2); color: var(--text-2); }
  .dbtn.ghost:hover { transform: translateY(-2px); border-color: var(--indigo); color: var(--text); }

  /* ── controls ── */
  .controls { position: fixed; top: 50%; right: 1.4rem; transform: translateY(-50%); z-index: 18;
    display: flex; flex-direction: column; gap: 0.5rem; }
  .cbtn {
    width: 40px; height: 40px; border-radius: 10px;
    background: rgba(11,14,23,0.7); border: 1px solid var(--line-2);
    backdrop-filter: blur(10px); color: var(--text-2); cursor: pointer;
    display: grid; place-items: center; font-size: 1rem; font-family: var(--mono);
    transition: all 0.18s;
  }
  .cbtn:hover { color: var(--text); border-color: var(--indigo); }
  .cbtn.active { color: var(--teal); border-color: var(--teal); }

  /* preview switcher */
  .preview-switch {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 20;
    display: flex; gap: 0.25rem; padding: 0.35rem;
    background: rgba(11,14,23,0.8); backdrop-filter: blur(14px);
    border: 1px solid var(--line-2); border-radius: 999px; font-size: 0.66rem;
  }
  .preview-switch a { padding: 0.4rem 0.7rem; color: var(--muted); text-decoration: none; border-radius: 999px; transition: all 0.2s; }
  .preview-switch a:hover { color: var(--text); }
  .preview-switch a.active { background: linear-gradient(120deg, var(--teal), var(--indigo)); color: #04050a; font-weight: 600; }

  /* intro flash */
  .flash {
    position: fixed; inset: 0; z-index: 30; background: var(--bg);
    display: grid; place-items: center; transition: opacity 0.8s 0.3s;
  }
  .flash.gone { opacity: 0; pointer-events: none; }
  .flash-inner { text-align: center; }
  .flash-orb {
    width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 1.2rem;
    background: conic-gradient(from 0deg, var(--teal), var(--indigo), var(--violet), var(--pink), var(--teal));
    animation: spin 2s linear infinite, pulseO 1.4s ease-in-out infinite;
    box-shadow: 0 0 50px -8px rgba(129,140,248,0.7);
  }
  @keyframes pulseO { 50% { transform: scale(1.15); } }
  .flash-text { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); letter-spacing: 0.2em; }

  @media (max-width: 720px) {
    .controls { right: 0.8rem; }
    .caption { bottom: 20vh; }
    .dock { bottom: 18vh; flex-wrap: wrap; justify-content: center; width: 90vw; }
    .hint { display: none; }
    .preview-switch { top: 64px; font-size: 0.6rem; }
  }
</style>
</head>
<body>

<div class="space"></div>
<div class="rings"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span></div>

<!-- top bar -->

</div>

<!-- caption -->
<div class="stage">
  <div class="caption" id="caption">
    <div class="caption-eyebrow" id="capEyebrow"></div>
    <div class="caption-text" id="capText"></div>
  </div>
</div>

<!-- contact dock -->
<div class="dock" id="dock">
  <a href="mailto:hello.priyankapm@gmail.com" class="dbtn primary">✉ hello.priyankapm@gmail.com</a>

</div>

<div class="controls">
  <button class="cbtn" id="prevBtn" aria-label="Previous">‹</button>
  <button class="cbtn active" id="playBtn" aria-label="Play/Pause">‖</button>
  <button class="cbtn" id="nextBtn" aria-label="Next">›</button>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  PARTICLE GENESIS
//  Thousands of particles swarm to form words, then morph.
//  Cursor disturbs the field. Pure canvas, no libraries.
// ════════════════════════════════════════════════════════════
(function () {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d', { alpha: true });
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, dpr = 1;
  // offscreen for sampling text
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { willReadFrequently: true });

  // ── content: each "scene" = a word/phrase + caption ──
  const SCENES = [
    { word: 'PRIYANKA\nDAS', eyebrow: 'AI-NATIVE PORTFOLIO', text: 'Senior Product Manager &amp; Business Architect — building AI products that ship.' },
    { word: 'SENIOR PM', eyebrow: 'THE ROLE', text: 'Nine years across <b>banking, public sector, insurance &amp; transport</b> — discovery to adoption.' },
    { word: 'AI BUILDER', eyebrow: 'THE SPECIALISM', text: '<b>Pega GenAI</b>, AI agents, agentic systems &amp; next-best-action decisioning you can actually explain.' },
    { word: '80% FASTER', eyebrow: 'THE IMPACT', text: '~80% reduction in claim processing time for an EU insurance client.' },
    { word: '1.2M USERS', eyebrow: 'THE SCALE', text: 'Platforms serving 1.2M users · 26 stakeholder funds aligned on one roadmap.' },
    { word: 'PrepOS', eyebrow: 'SHIPPED · LIVE', text: 'Founded, built &amp; shipped an adaptive AI interview coach — live at <b>pmprepos.com</b>.' },
    { word: "LET'S TALK", eyebrow: 'AVAILABLE NOW', text: 'Open to Senior PM / PO / AI Builder roles — Stockholm &amp; worldwide remote.', contact: true },
  ];

  // ── particles ──
  let particles = [];
  let PCOUNT = 3200;
  const mouse = { x: -9999, y: -9999, active: false };
  let scene = 0, playing = true, lastMorph = 0;
  const HOLD = 4200; // ms per scene

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    off.width = W; off.height = H;
    PCOUNT = W < 700 ? 1600 : (W < 1100 ? 2400 : 3400);
    ensureParticles();
    setScene(scene, true);
  }

  function ensureParticles() {
    if (particles.length === PCOUNT) return;
    if (particles.length < PCOUNT) {
      for (let i = particles.length; i < PCOUNT; i++) {
        particles.push({
          x: Math.random() * W, y: Math.random() * H,
          vx: 0, vy: 0, tx: W / 2, ty: H / 2,
          hue: 0, size: Math.random() * 1.4 + 0.7, twinkle: Math.random() * Math.PI * 2
        });
      }
    } else {
      particles.length = PCOUNT;
    }
  }

  // sample a word into target points
  function sampleWord(word) {
    octx.clearRect(0, 0, W, H);
    const lines = word.split('\n');
    let fs = Math.min(W * 0.18, H * 0.26, 200);
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    // shrink to fit width
    function widest() {
      octx.font = `800 ${fs}px Inter, sans-serif`;
      return Math.max(...lines.map(l => octx.measureText(l).width));
    }
    while (widest() > W * 0.86 && fs > 24) fs -= 4;
    octx.font = `800 ${fs}px Inter, sans-serif`;
    octx.fillStyle = '#fff';
    const lh = fs * 1.02;
    const startY = H * 0.43 - (lines.length - 1) * lh / 2;
    lines.forEach((l, i) => octx.fillText(l, W / 2, startY + i * lh));

    const img = octx.getImageData(0, 0, W, H).data;
    const step = W < 700 ? 4 : 5;
    const pts = [];
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        if (img[(y * W + x) * 4 + 3] > 128) pts.push({ x, y });
      }
    }
    return pts;
  }

  function setScene(idx, instant) {
    scene = (idx + SCENES.length) % SCENES.length;
    const pts = sampleWord(SCENES[scene].word);
    // assign each particle a target (resample to PCOUNT)
    for (let i = 0; i < PCOUNT; i++) {
      const p = particles[i];
      if (pts.length === 0) { p.tx = W / 2; p.ty = H / 2; continue; }
      const t = pts[Math.floor(i * pts.length / PCOUNT) % pts.length];
      // tiny jitter so it's organic
      p.tx = t.x + (Math.random() - 0.5) * 2.4;
      p.ty = t.y + (Math.random() - 0.5) * 2.4;
      // hue gradient across word width (teal→indigo→violet→pink)
      p.hue = 168 + (t.x / W) * 130; // 168 teal-ish → ~298 violet/pink
      if (instant) { p.x = p.tx; p.y = p.ty; }
    }
    // caption
    updateCaption();
    updateDots();
  }

  function updateCaption() {
    const s = SCENES[scene];
    const cap = document.getElementById('caption');
    cap.classList.remove('show');
    setTimeout(() => {
      document.getElementById('capEyebrow').textContent = s.eyebrow;
      document.getElementById('capText').innerHTML = s.text;
      cap.classList.add('show');
    }, 180);
    document.getElementById('dock').classList.toggle('show', !!s.contact);
  }

  function updateDots() {
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === scene));
  }

  // ── animation loop ──
  function tick(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    const k = 0.012, friction = 0.86, R = 120;
    for (let i = 0; i < PCOUNT; i++) {
      const p = particles[i];
      // spring to target
      p.vx += (p.tx - p.x) * k;
      p.vy += (p.ty - p.y) * k;
      // cursor repulsion
      if (mouse.active) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < R * R) {
          const d = Math.sqrt(d2) || 1;
          const force = (R - d) / R * 5.5;
          p.vx += (dx / d) * force;
          p.vy += (dy / d) * force;
        }
      }
      p.vx *= friction; p.vy *= friction;
      p.x += p.vx; p.y += p.vy;

      // twinkle
      p.twinkle += 0.05;
      const a = 0.55 + Math.sin(p.twinkle) * 0.25;
      const sat = 90, lig = 65;
      ctx.fillStyle = `hsla(${p.hue}, ${sat}%, ${lig}%, ${a})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // auto morph
    if (playing && !reduce && now - lastMorph > HOLD) {
      lastMorph = now;
      setScene(scene + 1);
    }
    requestAnimationFrame(tick);
  }

  // ── interaction ──
  window.addEventListener('pointermove', (e) => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
    document.getElementById('hint').classList.add('gone');
  });
  window.addEventListener('pointerdown', (e) => {
    // burst at click
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
    for (let i = 0; i < PCOUNT; i++) {
      const p = particles[i];
      const dx = p.x - e.clientX, dy = p.y - e.clientY;
      const d = Math.hypot(dx, dy) || 1;
      if (d < 200) { p.vx += dx / d * 14; p.vy += dy / d * 14; }
    }
  });
  window.addEventListener('pointerleave', () => mouse.active = false);
  window.addEventListener('blur', () => mouse.active = false);

  // controls
  function manual(dir) {
    lastMorph = performance.now();
    setScene(scene + dir);
  }
  document.getElementById('nextBtn').addEventListener('click', () => manual(1));
  document.getElementById('prevBtn').addEventListener('click', () => manual(-1));
  const playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? '‖' : '▶';
    playBtn.classList.toggle('active', playing);
    lastMorph = performance.now();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') manual(1);
    if (e.key === 'ArrowLeft') manual(-1);
    if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
  });

  // build progress dots
  const prog = document.getElementById('progress');
  SCENES.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'dot' + (i === 0 ? ' on' : '');
    b.setAttribute('aria-label', 'Scene ' + (i + 1));
    b.addEventListener('click', () => { lastMorph = performance.now(); setScene(i); });
    prog.appendChild(b);
  });

  window.addEventListener('resize', resize);

  // ── boot ──
  resize();
  // scatter start, then form first word
  particles.forEach(p => { p.x = Math.random() * W; p.y = Math.random() * H; });
  setScene(0, false);
  requestAnimationFrame(tick);

  setTimeout(() => document.getElementById('flash').classList.add('gone'), 900);
  lastMorph = performance.now() + 800;

  if (reduce) { playing = false; playBtn.textContent = '▶'; playBtn.classList.remove('active'); setScene(0, true); }
})();
</script>
</body>
</html>
